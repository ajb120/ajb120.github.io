<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <title>Bouncing balls</title>
        <style>
            html, body {
                margin: 0;
            }

            html {
                font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
                height: 100%;
            }

            body {
                overflow: hidden;
                height: inherit;
            }

            h1 {
                font-size: 2rem;
                letter-spacing: -1px;
                position: absolute;
                margin: 0;
                top: -4px;
                right: 5px;

                color: transparent;
                text-shadow: 0 0 4px white;
            }
        </style>
    </head>

    <body>
        <h1>bouncing balls</h1>
        <canvas></canvas>

        <script>
            const canvas = document.querySelector("canvas");
            const ctx = canvas.getContext("2d");

            const width = (canvas.width = window.innerWidth);
            const height = (canvas.height = window.innerHeight);

            function random(min, max) {
                return Math.floor(Math.random() * (max - min + 1)) + min;
            }

            function randomRGB() {
                return `rgb(${random(0, 255)},${random(0, 255)},${random(0, 255)})`;
            }

            class Ball {
                constructor(x, y, velX, velY, color, size) {
                    this.x = x;
                    this.y = y;
                    this.velX = velX;
                    this.velY = velY;
                    this.color = color;
                    this.size = size;
                    this.reflected = false;  //added
                }

                draw() {
                    ctx.beginPath();
                    ctx.fillStyle = this.color;
                    ctx.arc(this.x, this.y, this.size, 0, 2 * Math.PI);
                    ctx.fill();
                }

                  update() {
                    if (this.x + this.size >= width) {
                    this.velX = -this.velX;
                    }

                    if (this.x - this.size <= 0) {
                    this.velX = -this.velX;
                    }

                    if (this.y + this.size >= height) {
                    this.velY = -this.velY;
                    }

                    if (this.y - this.size <= 0) {
                    this.velY = -this.velY;
                    }

                    this.x += this.velX;
                    this.y += this.velY;
                }

                //collisionDetect extra credit added
                collisionDetect() {
                    for (const ball of balls) {
                        if (this !== ball) {
                            const dx = this.x - ball.x;
                            const dy = this.y - ball.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);

                            if (distance < this.size + ball.size) {
                                ball.color = this.color = randomRGB();

                                if (!this.reflected) {
                                    const tempVelX = this.velX;
                                    const tempVelY = this.velY;
                                    this.velX = ball.velX;
                                    this.velY = ball.velY;
                                    ball.velX = tempVelX;
                                    ball.velY = tempVelY;

                                    this.reflected = true;
                                    ball.reflected = true;
                                }
                            } else {
                                this.reflected = false;
                            }
                        }
                    }
                }
            }

            const balls = [];

            while (balls.length < 25) {
                const size = random(10, 20);
                
                // Ensure velocity is never 0
                const velX = random(1, 7) * (Math.random() < 0.5 ? 1 : -1);
                const velY = random(1, 7) * (Math.random() < 0.5 ? 1 : -1);

                const ball = new Ball(
                    random(0 + size, width - size),
                    random(0 + size, height - size),
                    velX,
                    velY,
                    randomRGB(),
                    size,
                );

                // Check for overlapping with existing balls - idrk why but I had one ball that was sticking to another so needed to add this
                let overlapping = false;
                for (const existingBall of balls) {
                    const dx = ball.x - existingBall.x;
                    const dy = ball.y - existingBall.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    if (distance < ball.size + existingBall.size) {
                        overlapping = true;
                        break;
                    }
                }

                if (!overlapping) {
                    balls.push(ball);
                }
            }

            function loop() {
                ctx.fillStyle = "rgb(0 0 0 / 25%)";
                ctx.fillRect(0, 0, width, height);

                for (const ball of balls) {
                    ball.draw();
                    ball.update();
                    ball.collisionDetect();  //added
                }

                requestAnimationFrame(loop);
            }

            loop();

            const testBall = new Ball(50, 100, 4, 4, "blue", 10);
            testBall.x;
            testBall.size;
            testBall.color;
            testBall.draw();
        </script>
    </body>
</html>
